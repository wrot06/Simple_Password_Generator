<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Password Generator</title>
<link rel="stylesheet" href="css/bulma.min.css">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container p-2">

<div class="developer">
<a href="https://www.youtube.com/@wareorto" target="_blank" rel="noopener" id="developerLink">by wrot06</a>
</div>

<div class="options">
<label class="checkbox"><input type="checkbox" id="uppercase" checked> Aa</label>
<label class="checkbox"><input type="checkbox" id="numbers" checked> 123</label>
<label class="checkbox"><input type="checkbox" id="special" checked> #@&</label>
</div>

<div class="lengthBox">
<label class="label is-medium">Length: <span id="lengthValue">8</span></label>
<input type="range" id="lengthSlider" min="6" max="16" value="8" class="slider is-fullwidth">
</div>

<div class="field has-addons mb-2">

<div class="control is-expanded">
<input type="text" id="passwordOutput" class="input is-medium" placeholder="Medium input" readonly>
</div>
</div>

<div class="buttons has-addons">
  <button id="copyBtn" class="button is-dark is-normal">Copy</button>
  <button id="generateBtn" class="button is-primary is-normal">Run Generate Password</button>
</div>

<script src="popup.js"></script>

</body>
</html>
